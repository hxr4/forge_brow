<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forge</title>
<style>
:root{
  --void:#000000;
  --ink:#050604;
  --card:rgba(255,255,255,.022);
  --card-hi:rgba(255,255,255,.045);
  --line:rgba(255,255,255,.065);
  --line-hi:rgba(255,255,255,.13);
  --moss:#96965A;
  --moss-deep:#585738;
  --acid:#CFE85C;
  --cream:#F4F2E7;
  --bone:#B9BBA8;
  --muted:#6B6F5E;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--void);
  color:var(--cream);
  font:400 14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit;background:none;border:0;outline:none}

.bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.watermark{
  position:absolute;left:8%;top:32%;font-size:34vw;line-height:.8;font-weight:700;
  letter-spacing:-.04em;color:#fff;opacity:.018;font-family:Georgia,"Times New Roman",serif;
  user-select:none;
}
.glowfield{
  position:absolute;left:50%;top:38%;width:110vw;height:70vh;transform:translate(-50%,-50%);
  background:radial-gradient(ellipse at 62% 28%,rgba(150,150,90,.10),transparent 58%);
}
.guide{position:absolute;background:var(--line);opacity:0;animation:drawIn 1.1s var(--ease) .5s forwards}
.guide.v{width:1px;top:0;bottom:0;transform-origin:top}
.guide.h{height:1px;left:0;right:0;transform-origin:left}
@keyframes drawIn{to{opacity:.5}}
.cross{position:absolute;width:11px;height:11px;opacity:0;animation:fadeIn .6s var(--ease) 1s forwards}
.cross:before,.cross:after{content:"";position:absolute;background:var(--moss-deep)}
.cross:before{left:5px;top:0;width:1px;height:11px}
.cross:after{top:5px;left:0;height:1px;width:11px}
@keyframes fadeIn{to{opacity:.75}}

.wrap{position:relative;z-index:1;max-width:1320px;margin:0 auto;padding:26px 40px 22px}

.rise{opacity:0;transform:translateY(16px);animation:rise .8s var(--ease) forwards}
@keyframes rise{to{opacity:1;transform:none}}

.masthead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:start}

.brand{position:relative;padding-top:6px}
.wordmark{display:flex;align-items:baseline;gap:2px;position:relative}
.wordmark .glyph{
  font-family:Georgia,"Times New Roman",serif;font-size:70px;line-height:.9;font-weight:700;
  letter-spacing:-.02em;
  background:linear-gradient(158deg,#f6f4e8 6%,#b9b98a 26%,#6d6c46 46%,#e8e6d2 62%,#8f8f5c 82%,#3d3d28 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 26px rgba(150,150,90,.28));
}
.wordmark .reg{font-size:13px;color:var(--moss);transform:translateY(-38px);margin-left:3px}
.wordmark .catO{position:relative;display:inline-block;width:51px;height:51px;transform:translateY(5px)}
.spark{position:absolute;color:var(--cream);opacity:.7;font-size:13px;animation:twinkle 3.4s ease-in-out infinite}
.spark.a{left:-14px;top:6px}
.spark.b{right:-24px;top:22px;animation-delay:1.1s}
.spark.c{right:-46px;top:52px;font-size:9px;animation-delay:2.2s}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:.85;transform:scale(1.15)}}
.tagline{
  margin-top:10px;font-size:10.5px;letter-spacing:.42em;color:var(--muted);text-transform:uppercase;
  padding-left:3px;
}
.brandrule{margin-top:12px;height:1px;width:418px;max-width:100%;
  background:linear-gradient(90deg,var(--line-hi),transparent)}

.mastright{display:flex;align-items:flex-start;gap:28px}
.catwrap{width:290px;height:172px;position:relative;margin-top:-4px}
.catwrap svg{width:100%;height:100%;overflow:visible}
.motto{padding-top:34px;border-left:1px solid var(--line);padding-left:22px;min-height:120px}
.motto p{font-size:10.5px;letter-spacing:.34em;line-height:2.1;color:var(--bone);text-transform:uppercase}
.motto .rule{margin-top:26px;height:1px;width:74px;background:var(--line-hi)}

.strip{display:grid;grid-template-columns:minmax(320px,1fr) minmax(260px,.72fr) minmax(340px,.95fr);
  gap:20px;align-items:stretch;margin-top:20px}

.clockbox{padding-top:6px}
.clock{display:flex;align-items:flex-start;gap:10px}
.time{
  font-size:84px;line-height:.86;font-weight:200;letter-spacing:-.045em;color:#F7F3DF;
  font-variant-numeric:tabular-nums;
  text-shadow:0 0 46px rgba(214,214,150,.34),0 0 16px rgba(255,255,255,.14);
  display:flex;
}
.time .sep{opacity:.55;animation:tick 2s steps(1,end) infinite}
@keyframes tick{0%,50%{opacity:.55}51%,100%{opacity:.12}}
.time .d{display:inline-block;transition:transform .3s var(--ease),opacity .3s var(--ease)}
.time .d.flip{animation:flip .42s var(--ease)}
@keyframes flip{0%{transform:translateY(-42%) scale(.94);opacity:0}100%{transform:none;opacity:1}}
.ampm{font-size:17px;letter-spacing:.06em;color:var(--bone);margin-top:11px;font-weight:400}
.datel{margin-top:14px;display:flex;align-items:center;gap:16px}
.datel b{font-size:11.5px;letter-spacing:.24em;font-weight:600;color:var(--bone);text-transform:uppercase}
.datel i{flex:1;height:1px;background:linear-gradient(90deg,var(--line-hi),transparent);max-width:230px}
.quote{margin-top:16px;display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px}
.quote em{font-style:italic}
.quote s{width:26px;height:1px;background:var(--line-hi);display:block;text-decoration:none}

.card{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  backdrop-filter:blur(9px);position:relative;overflow:hidden;
  transition:border-color .35s var(--ease),background .35s var(--ease),transform .35s var(--ease);
}
.card:before{
  content:"";position:absolute;inset:0;border-radius:16px;pointer-events:none;opacity:0;
  box-shadow:inset 0 0 0 1px rgba(207,232,92,.16),0 0 34px rgba(150,150,90,.14);
  transition:opacity .4s var(--ease);
}
.card:hover:before{opacity:1}

.weather{display:flex;align-items:center;gap:18px;padding:20px 22px}
.weather .icon{width:70px;height:52px;flex:none;color:var(--cream);filter:drop-shadow(0 0 16px rgba(255,255,255,.16))}
.weather .temp{font-size:36px;font-weight:300;letter-spacing:-.02em;line-height:1}
.weather .cond{margin-top:7px;font-size:12.5px;color:var(--bone)}
.weather .place{margin-top:2px;font-size:12px;color:var(--muted)}

.shield{display:flex;align-items:center;gap:18px;padding:18px 20px}
.ring{width:96px;height:96px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .dot{position:absolute;left:50%;top:50%;width:3px;height:3px;border-radius:50%;
  background:var(--acid);transform:translate(-50%,-50%);box-shadow:0 0 10px var(--acid)}
.shieldnum{font-size:34px;font-weight:300;letter-spacing:-.02em;line-height:1;color:var(--cream)}
.shieldlab{margin-top:6px;font-size:11.5px;color:var(--bone);max-width:104px;line-height:1.35}
.breakdown{margin-left:auto;display:grid;gap:7px;padding-right:4px}
.brow{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:baseline;font-size:11px}
.brow b{font-weight:600;color:var(--cream);text-align:right;font-variant-numeric:tabular-nums}
.brow span{color:var(--muted)}
.expand{position:absolute;right:12px;bottom:11px;width:20px;height:20px;color:var(--muted);
  transition:color .3s var(--ease),transform .3s var(--ease)}
.expand:hover{color:var(--acid);transform:translate(2px,-2px)}

.trays{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:18px}
.tray{padding:15px 15px 16px}
.trayhead{display:flex;align-items:center;gap:9px;margin-bottom:16px}
.trayhead .ic{width:15px;height:15px;color:var(--bone);flex:none}
.trayhead h3{font-size:13px;font-weight:500;letter-spacing:.01em;color:var(--cream)}
.trayhead .go{margin-left:auto;width:18px;height:18px;color:var(--muted);
  transition:color .3s var(--ease),transform .35s var(--ease)}
.trayhead .go:hover{color:var(--acid);transform:translateX(3px)}
.trayhead .go.open{transform:rotate(90deg)}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.tile{
  position:relative;aspect-ratio:1;border-radius:13px;background:rgba(255,255,255,.028);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  transition:transform .28s var(--ease),border-color .28s var(--ease),background .28s var(--ease),box-shadow .28s var(--ease);
  opacity:0;animation:pop .42s var(--ease) forwards;
}
@keyframes pop{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
.tile:hover{transform:translateY(-4px);border-color:var(--line-hi);background:rgba(255,255,255,.06);
  box-shadow:0 10px 28px rgba(0,0,0,.55),0 0 22px rgba(150,150,90,.16)}
.tile:active{transform:translateY(-1px) scale(.97)}
.tile img{width:26px;height:26px;border-radius:6px;pointer-events:none}
.tile .mono{font-size:14px;font-weight:600;color:var(--bone)}
.tile .kill{
  position:absolute;top:-6px;right:-6px;width:17px;height:17px;border-radius:50%;
  background:#1a1a14;border:1px solid var(--line-hi);color:var(--muted);font-size:10px;
  display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.6);
  transition:opacity .2s var(--ease),transform .2s var(--ease),color .2s;
}
.tile:hover .kill{opacity:1;transform:none}
.tile .kill:hover{color:var(--cream);border-color:var(--moss)}
.tile.add{border-style:dashed;border-color:var(--line);color:var(--muted)}
.tile.add:hover{color:var(--acid);border-color:var(--moss-deep)}
.tile.add svg{width:16px;height:16px}
.tip{
  position:absolute;bottom:-25px;left:50%;transform:translateX(-50%) translateY(4px);
  font-size:10.5px;color:var(--bone);white-space:nowrap;opacity:0;pointer-events:none;
  transition:opacity .2s var(--ease),transform .2s var(--ease);z-index:4;
}
.tile:hover .tip{opacity:1;transform:translateX(-50%)}

.addrow{grid-column:1/-1;display:none;margin-top:4px}
.addrow.on{display:block}
.addrow input{width:100%;padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.04);
  border:1px solid var(--line-hi);font-size:12px}
.addrow input:focus{border-color:var(--moss)}

.searchrow{display:flex;justify-content:center;margin-top:22px}
.search{
  display:flex;align-items:center;gap:12px;width:530px;max-width:100%;
  padding:13px 19px;border-radius:999px;background:rgba(255,255,255,.028);
  border:1px solid var(--line);transition:all .38s var(--ease);
}
.search:focus-within{width:600px;border-color:var(--moss);background:rgba(255,255,255,.05);
  box-shadow:0 0 40px rgba(150,150,90,.18)}
.search svg{width:17px;height:17px;color:var(--muted);flex:none}
.search input{flex:1;font-size:13.5px}
.search input::placeholder{color:var(--muted)}
.search .send{width:20px;height:20px;color:var(--muted);opacity:0;transition:all .3s var(--ease)}
.search:focus-within .send{opacity:1;color:var(--acid)}

.footer{display:flex;align-items:flex-end;justify-content:space-between;margin-top:20px;gap:20px}
.chip{display:flex;align-items:center;gap:11px;padding:11px 15px;border-radius:13px;
  background:var(--card);border:1px solid var(--line)}
.chip .mk{width:24px;height:24px;color:var(--cream)}
.chip b{display:block;font-size:12.5px;font-weight:500}
.chip span{display:block;font-size:10.5px;color:var(--muted);margin-top:1px}
.credo{text-align:right;font-size:10px;letter-spacing:.28em;color:var(--muted);line-height:1.9;
  text-transform:uppercase}

.servers{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px;min-height:0}
.srv{font-size:11px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);
  color:var(--bone);transition:all .28s var(--ease);font-variant-numeric:tabular-nums}
.srv:hover{border-color:var(--moss);color:var(--acid);box-shadow:0 0 18px rgba(150,150,90,.2)}

@media (max-width:1150px){
  .strip{grid-template-columns:1fr 1fr}
  .trays{grid-template-columns:1fr}
  .mastright{display:none}
}
</style>
</head>
<body>

<div class="bg">
  <div class="glowfield"></div>
  <div class="watermark">forge</div>
  <div class="guide v" style="left:19%"></div>
  <div class="guide h" style="top:74%"></div>
  <div class="cross" style="left:calc(19% - 5px);top:74%"></div>
  <div class="cross" style="left:78%;top:12%"></div>
</div>

<div class="wrap">

  <div class="masthead rise" style="animation-delay:.05s">
    <div class="brand">
      <div class="wordmark">
        <span class="spark a">&#10022;</span>
        <span class="spark b">&#10022;</span>
        <span class="spark c">&#10022;</span>
        <span class="glyph">F</span>
        <span class="catO">
          <svg viewBox="0 0 62 62" fill="none">
            <circle cx="31" cy="31" r="27" stroke="url(#og)" stroke-width="7"/>
            <path d="M20 24c0-6 4-9 11-9s11 3 11 9c0 7-5 12-11 12s-11-5-11-12z" fill="#0a0a08"/>
            <path d="M20 24l-2-8 7 3M42 24l2-8-7 3" stroke="#cfcf9a" stroke-width="1.6" stroke-linejoin="round" fill="#0a0a08"/>
            <ellipse class="eyeL" cx="26.5" cy="25" rx="2.6" ry="3.4" fill="#CFE85C"/>
            <ellipse class="eyeR" cx="35.5" cy="25" rx="2.6" ry="3.4" fill="#CFE85C"/>
            <path d="M31 30l-2 1.6h4L31 30z" fill="#f0eedd"/>
            <defs>
              <linearGradient id="og" x1="0" y1="0" x2="62" y2="62">
                <stop offset="0" stop-color="#f6f4e8"/><stop offset=".45" stop-color="#7d7c50"/>
                <stop offset="1" stop-color="#e8e6d2"/>
              </linearGradient>
            </defs>
          </svg>
        </span>
        <span class="glyph">rge</span>
        <span class="reg">&#174;</span>
      </div>
      <div class="tagline">Browse&nbsp; Build&nbsp; Explore</div>
      <div class="brandrule"></div>
    </div>

    <div class="mastright">
      <div class="catwrap">
        <svg viewBox="0 0 330 200" fill="none">
          <g stroke="#8d8d60" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M100 104c0-37 29-63 65-63s65 26 65 63c0 33-24 60-65 60s-65-27-65-60z"/>
            <path d="M113 62l-9-40 41 20"/>
            <path d="M217 62l9-40-41 20"/>
            <path d="M96 112c-22 4-42 13-58 27M96 124c-24 7-44 19-58 33M100 136c-20 11-36 25-46 41"/>
            <path d="M234 112c22 4 42 13 58 27M234 124c24 7 44 19 58 33M230 136c20 11 36 25 46 41"/>
          </g>
          <path d="M152 150q13 13 26 0l10 44h-46z" fill="#efedda" opacity=".92"/>
          <ellipse class="eyeL2" cx="140" cy="100" rx="12.5" ry="15.5" fill="#0b0b07" stroke="#b8b880" stroke-width="1.2"/>
          <ellipse class="eyeR2" cx="190" cy="100" rx="12.5" ry="15.5" fill="#0b0b07" stroke="#b8b880" stroke-width="1.2"/>
          <ellipse class="pupL" cx="140" cy="100" rx="6" ry="10.5" fill="#CFE85C" opacity=".95"/>
          <ellipse class="pupR" cx="190" cy="100" rx="6" ry="10.5" fill="#CFE85C" opacity=".95"/>
          <path d="M165 124l-8.5 7.5h17L165 124z" fill="#efedda"/>
          <path d="M156.5 131.5q8.5 9 17 0" stroke="#8d8d60" stroke-width="1.2" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="motto">
        <p>Same<br>internet.<br>A sharper<br>you.</p>
        <div class="rule"></div>
      </div>
    </div>
  </div>

  <div class="strip">
    <div class="clockbox rise" style="animation-delay:.12s">
      <div class="clock">
        <div class="time" id="time"></div>
        <div class="ampm" id="ampm"></div>
      </div>
      <div class="datel"><b id="date"></b><i></i></div>
      <div class="quote"><s></s><em id="quip">Ideas browse here.</em></div>
    </div>

    <div class="card weather rise" style="animation-delay:.2s" id="weather">
      <svg class="icon" viewBox="0 0 70 52" fill="none">
        <path d="M20 44h27a12 12 0 0 0 1-24 16 16 0 0 0-30-3 10 10 0 0 0 2 27z"
              fill="rgba(255,255,255,.10)" stroke="currentColor" stroke-width="1.4"/>
      </svg>
      <div>
        <div class="temp" id="wtemp" hidden></div>
        <div class="cond" id="wcond">Weather offline</div>
        <div class="place" id="wplace">Add an AccuWeather key to config/forge.env</div>
      </div>
    </div>

    <div class="card shield rise" style="animation-delay:.28s">
      <div class="ring">
        <svg width="96" height="96">
          <circle cx="48" cy="48" r="40" stroke="rgba(255,255,255,.07)" stroke-width="4" fill="none"/>
          <circle id="arc" cx="48" cy="48" r="40" stroke="url(#ag)" stroke-width="4" fill="none"
                  stroke-linecap="round" stroke-dasharray="251" stroke-dashoffset="251"
                  style="transition:stroke-dashoffset 1.4s cubic-bezier(.22,.61,.36,1)"/>
          <defs><linearGradient id="ag" x1="0" y1="0" x2="96" y2="96">
            <stop offset="0" stop-color="#585738"/><stop offset=".6" stop-color="#96965A"/>
            <stop offset="1" stop-color="#CFE85C"/></linearGradient></defs>
        </svg>
        <span class="dot" id="ringdot"></span>
      </div>
      <div>
        <div class="shieldnum" id="blocked">0</div>
        <div class="shieldlab" id="shieldlab">Requests blocked</div>
      </div>
      <div class="breakdown" id="breakdown"></div>
      <button class="expand" id="expand" title="Lifetime totals">
        <svg viewBox="0 0 20 20" fill="none"><path d="M7 13L13 7M13 7H8M13 7v5"
          stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>

  <div class="trays" id="trays"></div>

  <div class="searchrow rise" style="animation-delay:.44s">
    <form class="search" id="search">
      <svg viewBox="0 0 17 17" fill="none"><circle cx="7.5" cy="7.5" r="5.5" stroke="currentColor"
        stroke-width="1.5"/><path d="M12 12l4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <input id="q" placeholder="Search the web privately..." autocomplete="off" spellcheck="false">
      <button class="send" type="submit" aria-label="Go">
        <svg viewBox="0 0 20 20" fill="none"><path d="M4 10h12M11 5l5 5-5 5" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </form>
  </div>

  <div class="servers" id="servers"></div>

  <div class="footer rise" style="animation-delay:.52s">
    <div class="chip">
      <svg class="mk" viewBox="0 0 24 24" fill="none">
        <path d="M5 10c0-4 3-6 7-6s7 2 7 6c0 5-3 9-7 9s-7-4-7-9z" stroke="currentColor" stroke-width="1.3"/>
        <path d="M5 10L4 3l5 3M19 10l1-7-5 3" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
        <circle cx="9.5" cy="10" r="1.3" fill="#CFE85C"/><circle cx="14.5" cy="10" r="1.3" fill="#CFE85C"/>
      </svg>
      <div><b>Forge Browser</b><span id="ver">v0.1.0</span></div>
    </div>
    <div class="credo">A cleaner web<br>for a brighter mind.</div>
  </div>

</div>

<script>
const post = (action, payload) => fetch('/api/command', {
  method:'POST', headers:{'Content-Type':'application/json'},
  body: JSON.stringify({action, payload: payload||{}})
}).catch(()=>{});
const getState = () => fetch('/api/state',{cache:'no-store'}).then(r=>r.json()).catch(()=>({}));
const hostOf = u => { try { return new URL(u).host.replace(/^www\./,'') } catch(e) { return u } };

const QUIPS = ['Ideas browse here.','Nothing is watching.','Built for what you build.',
  'Fewer requests, more signal.','The quiet tab.','Ship something today.'];

let lastRevision = -1;
let openTray = null;
let addingIn = null;

function pad(n){ return n<10 ? '0'+n : ''+n }

const timeEl = document.getElementById('time');
let shown = '';
function paintClock(){
  const now = new Date();
  let h = now.getHours();
  const ampm = h>=12 ? 'PM' : 'AM';
  h = h%12; if(!h) h=12;
  const text = pad(h)+':'+pad(now.getMinutes());
  if(text !== shown){
    const prev = shown;
    shown = text;
    timeEl.innerHTML = '';
    for(let i=0;i<text.length;i++){
      const c = text[i];
      const s = document.createElement('span');
      s.className = c===':' ? 'sep' : 'd';
      s.textContent = c;
      if(prev && prev[i] !== c && c!==':') s.classList.add('flip');
      timeEl.appendChild(s);
    }
  }
  document.getElementById('ampm').textContent = ampm;
  document.getElementById('date').textContent =
    now.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'})
       .replace(/,/g,'').toUpperCase();
}
paintClock();
setInterval(paintClock, 1000);
document.getElementById('quip').textContent = QUIPS[Math.floor(Math.random()*QUIPS.length)];

function iconFor(site){
  const wrap = document.createElement('span');
  const mono = document.createElement('span');
  mono.className = 'mono';
  mono.textContent = (site.title||hostOf(site.url)||'?').trim().charAt(0).toUpperCase();
  let src;
  try { src = new URL('/favicon.ico', site.url).href; }
  catch(e){ wrap.appendChild(mono); return wrap; }
  const img = document.createElement('img');
  img.loading = 'lazy';
  img.onerror = () => { img.remove(); wrap.appendChild(mono); };
  img.src = src;
  wrap.appendChild(img);
  return wrap;
}

const TRAY_ICONS = {
  Developer:'<path d="M6 5L2 8.5 6 12M9.5 4L7 13M11 5l4 3.5-4 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>',
  Dev:'<path d="M6 5L2 8.5 6 12M9.5 4L7 13M11 5l4 3.5-4 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>',
  Personal:'<circle cx="7.5" cy="5" r="3" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M2 14c0-3 2.5-5 5.5-5s5.5 2 5.5 5" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/>',
  Entertainment:'<rect x="1.5" y="4.5" width="12" height="7.5" rx="3.4" stroke="currentColor" stroke-width="1.3" fill="none"/><path d="M4.6 8.2h1.8M5.5 7.3v1.8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><circle cx="10.4" cy="7.6" r=".85" fill="currentColor"/><circle cx="11.7" cy="9.2" r=".85" fill="currentColor"/>'
};

function buildTray(tray){
  const card = document.createElement('div');
  card.className = 'card tray';

  const head = document.createElement('div');
  head.className = 'trayhead';
  const ic = document.createElementNS('http://www.w3.org/2000/svg','svg');
  ic.setAttribute('class','ic'); ic.setAttribute('viewBox','0 0 16 16');
  ic.innerHTML = TRAY_ICONS[tray.name] || TRAY_ICONS.Personal;
  const h3 = document.createElement('h3');
  h3.textContent = tray.name;
  const go = document.createElement('button');
  go.className = 'go' + (openTray===tray.name ? ' open' : '');
  go.innerHTML = '<svg viewBox="0 0 18 18" fill="none"><path d="M6 3l6 6-6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  go.title = openTray===tray.name ? 'Show fewer' : 'Show all';
  go.onclick = () => { openTray = openTray===tray.name ? null : tray.name; render(true); };
  head.append(ic,h3,go);

  const grid = document.createElement('div');
  grid.className = 'grid';
  const limit = openTray===tray.name ? tray.sites.length : 7;

  tray.sites.slice(0, limit).forEach((site,i) => {
    const tile = document.createElement('a');
    tile.className = 'tile';
    tile.href = site.url;
    tile.style.animationDelay = (0.03*i)+'s';
    tile.title = site.title || hostOf(site.url);
    tile.appendChild(iconFor(site));
    const tip = document.createElement('span');
    tip.className = 'tip';
    tip.textContent = site.title || hostOf(site.url);
    tile.appendChild(tip);
    const kill = document.createElement('button');
    kill.className = 'kill';
    kill.textContent = '×';
    kill.title = 'Remove';
    kill.onclick = e => {
      e.preventDefault(); e.stopPropagation();
      tile.style.transform = 'scale(.6)'; tile.style.opacity = '0';
      post('removeShortcut',{url:site.url, tray:tray.name});
      setTimeout(()=>render(true), 220);
    };
    tile.appendChild(kill);
    tile.onclick = e => { e.preventDefault(); post('navigate',{url:site.url}); };
    grid.appendChild(tile);
  });

  const add = document.createElement('button');
  add.className = 'tile add';
  add.innerHTML = '<svg viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
  add.title = 'Add a shortcut';
  add.onclick = () => { addingIn = addingIn===tray.name ? null : tray.name; render(true); };
  grid.appendChild(add);

  const row = document.createElement('div');
  row.className = 'addrow' + (addingIn===tray.name ? ' on' : '');
  const input = document.createElement('input');
  input.placeholder = 'Paste a URL, then press Return';
  input.onkeydown = e => {
    if(e.key === 'Escape'){ addingIn = null; render(true); return; }
    if(e.key !== 'Enter') return;
    const raw = input.value.trim();
    if(!raw) return;
    const url = /^https?:\/\//.test(raw) ? raw : 'https://'+raw;
    post('addShortcut',{url:url, title:hostOf(url), tray:tray.name});
    addingIn = null;
    input.value = '';
    setTimeout(()=>render(true), 260);
  };
  row.appendChild(input);
  grid.appendChild(row);

  card.append(head, grid);
  if(addingIn===tray.name) setTimeout(()=>input.focus(), 30);
  return card;
}

let expanded = false;
document.getElementById('expand').onclick = () => { expanded = !expanded; render(true); };

function paintShield(state){
  const shields = state.shields || {};
  const stats = state.stats || {};
  const by = shields.byType || {};
  const seen = shields.requestsSeen || 0;
  const session = shields.sessionBlocked || 0;
  const lifetime = stats.lifetimeBlocked || 0;

  document.getElementById('blocked').textContent = (expanded ? session : lifetime).toLocaleString();
  document.getElementById('shieldlab').textContent =
    expanded ? 'Blocked this session' : 'Requests blocked, lifetime';

  const pct = seen ? Math.min(1, session/seen) : 0;
  document.getElementById('arc').style.strokeDashoffset = String(251 - 251*pct);
  document.querySelector('.ring').title =
    seen ? Math.round(pct*100)+'% of '+seen.toLocaleString()+' requests blocked this session'
         : 'No requests seen yet';
  const rad = (-90 + 360*pct)*Math.PI/180;
  const dot = document.getElementById('ringdot');
  dot.style.left = (48 + 40*Math.cos(rad))+'px';
  dot.style.top = (48 + 40*Math.sin(rad))+'px';
  dot.style.opacity = pct ? '1' : '0';

  const rows = expanded
    ? [[fmt(stats.lifetimeBytesSaved||0),'Saved'], [Math.round(pct*100)+'%','Of requests'],
       [shields.popupsBlocked||0,'Popups'], [shields.lists||0,'Lists']]
    : [[by.scripts||0,'Scripts'], [by.beacons||0,'Beacons'],
       [by.images||0,'Images'], [by.frames||0,'Frames']];

  const box = document.getElementById('breakdown');
  box.innerHTML = '';
  rows.forEach(([v,l]) => {
    const row = document.createElement('div');
    row.className = 'brow';
    const b = document.createElement('b'); b.textContent = v;
    const sp = document.createElement('span'); sp.textContent = l;
    row.append(b,sp); box.appendChild(row);
  });
}

function fmt(n){
  if(!n) return '0B';
  const u=['B','KB','MB','GB']; let i=0,v=n;
  while(v>=1024&&i<u.length-1){v/=1024;i++}
  return v.toFixed(v<10&&i>0?1:0)+u[i];
}

let cache = {};
function render(force){
  const state = cache;
  const host = document.getElementById('trays');
  const trays = state.trays || [];
  host.innerHTML = '';
  trays.forEach((tray,i) => {
    const card = buildTray(tray);
    card.classList.add('rise');
    card.style.animationDelay = (0.3 + i*0.06)+'s';
    host.appendChild(card);
  });
  paintShield(state);

  const srv = document.getElementById('servers');
  srv.innerHTML = '';
  (state.devServers||[]).slice(0,7).forEach(s => {
    const a = document.createElement('button');
    a.className = 'srv';
    a.textContent = 'localhost:'+s.port+'  '+(s.process||'');
    a.onclick = () => post('navigate',{url:s.url});
    srv.appendChild(a);
  });
}

document.getElementById('search').onsubmit = e => {
  e.preventDefault();
  const v = document.getElementById('q').value.trim();
  if(!v) return;
  post('navigate',{url:v});
  document.getElementById('q').value = '';
};

function blink(){
  const eyes = document.querySelectorAll('.pupL,.pupR,.eyeL,.eyeR');
  eyes.forEach(e => { e.style.transition='transform .12s ease'; e.style.transformOrigin='center';
    e.style.transform='scaleY(.08)'; });
  setTimeout(()=>eyes.forEach(e=>e.style.transform='none'), 130);
  setTimeout(blink, 3200 + Math.random()*4200);
}
setTimeout(blink, 2200);

document.addEventListener('mousemove', e => {
  const x = (e.clientX/window.innerWidth - .5);
  const y = (e.clientY/window.innerHeight - .5);
  document.querySelectorAll('.pupL,.pupR').forEach(p => {
    p.style.transform = 'translate('+(x*5).toFixed(2)+'px,'+(y*4).toFixed(2)+'px)';
  });
});

async function poll(){
  const state = await getState();
  if(state && state.revision !== lastRevision){
    lastRevision = state.revision;
    cache = state;
    render(true);
  } else if(state){
    cache = state;
  }
  setTimeout(poll, 1600);
}
poll();
</script>
