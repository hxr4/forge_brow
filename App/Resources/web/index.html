<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New Tab</title>
<style>
:root{
  --bg:#121214; --raised:#1B1B1E; --raised-hi:#242428; --line:#2A2A2E; --line-hi:#3A3A3F;
  --text:#EDEDEF; --text-2:#B5B5BC; --text-3:#8C8C94;
  --accent:#CFE85C; --olive:#A4A86A; --danger:#FF6B5E;
  --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font:400 14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;min-height:100%;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit;background:none;border:0;outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

main{flex:1;width:100%;max-width:820px;margin:0 auto;padding:16vh 32px 40px}

/* search */
.search{display:flex;align-items:center;gap:12px;height:52px;padding:0 18px;
  background:var(--raised);border:1px solid var(--line);border-radius:14px;
  transition:border-color .15s ease,background .15s ease}
.search:focus-within{border-color:var(--olive);background:var(--raised-hi)}
.search svg{width:18px;height:18px;color:var(--text-3);flex:none}
.search input{flex:1;font-size:16px;height:100%}
.search input::placeholder{color:var(--text-3)}
.search input:focus-visible{outline:none}
.search kbd{font:500 11px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text-3);
  border:1px solid var(--line-hi);border-radius:5px;padding:2px 6px}
.search:focus-within kbd{display:none}

/* trays */
.trayhead{display:flex;align-items:center;gap:4px;margin:40px 0 14px}
.traytab{padding:6px 12px;border-radius:8px;color:var(--text-3);font-size:13px;font-weight:500;
  transition:color .12s ease,background .12s ease}
.traytab:hover{color:var(--text-2);background:var(--raised)}
.traytab.on{color:var(--text);background:var(--raised-hi)}
.traytab[contenteditable=true]{outline:1px solid var(--olive);cursor:text}
.trayhead .spacer{flex:1}
.ghost{padding:6px 10px;border-radius:8px;color:var(--text-3);font-size:12.5px}
.ghost:hover{color:var(--text);background:var(--raised)}
.ghost.on{color:var(--accent)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:9px;
  padding:16px 8px 12px;border-radius:var(--radius);text-decoration:none;color:var(--text-2);
  transition:background .12s ease}
.tile:hover{background:var(--raised)}
.tile:active{background:var(--raised-hi)}
.tile .ic{width:44px;height:44px;border-radius:11px;background:var(--raised-hi);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.tile .ic img{width:24px;height:24px;pointer-events:none}
.tile .ic b{font-size:17px;font-weight:600;color:var(--text)}
.tile .lab{font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .lab[contenteditable=true]{outline:1px solid var(--olive);border-radius:4px;padding:0 4px;
  text-overflow:clip;cursor:text;color:var(--text)}
.tile .x{position:absolute;top:6px;right:10px;width:20px;height:20px;border-radius:50%;
  background:var(--raised-hi);border:1px solid var(--line-hi);color:var(--text-2);font-size:12px;line-height:1;
  display:none;align-items:center;justify-content:center}
.tile .x:hover{color:var(--danger);border-color:var(--danger)}
.editing .tile .x{display:flex}
.editing .tile{cursor:grab}
.tile.dragging{opacity:.35}
.tile.drop{background:var(--raised-hi);box-shadow:inset 0 0 0 1px var(--olive)}
.tile.add{color:var(--text-3)}
.tile.add .ic{background:transparent;border-style:dashed;border-color:var(--line-hi)}
.tile.add svg{width:16px;height:16px}

.addrow{display:none;gap:8px;margin-top:12px}
.addrow.on{display:flex}
.addrow input{flex:1;height:36px;padding:0 12px;border-radius:9px;background:var(--raised);
  border:1px solid var(--line);font-size:13px}
.addrow input:focus{border-color:var(--olive)}
.btn{height:36px;padding:0 14px;border-radius:9px;background:var(--raised-hi);color:var(--text);
  font-size:13px;font-weight:500}
.btn:hover{background:var(--line-hi)}
.empty{color:var(--text-3);font-size:13px;padding:22px 4px}

/* dev servers */
.servers{margin-top:36px}
.servers h2{font-size:12px;font-weight:600;color:var(--text-3);margin-bottom:10px;display:flex;gap:10px;align-items:center}
.servers h2 button{font-size:12px;font-weight:400;color:var(--text-3)}
.servers h2 button:hover{color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;height:30px;text-decoration:none;padding:0 12px;border-radius:8px;
  background:var(--raised);border:1px solid var(--line);font:12px ui-monospace,SFMono-Regular,Menlo,monospace;
  color:var(--text-2)}
.chip:hover{border-color:var(--line-hi);color:var(--text)}
.chip i{width:6px;height:6px;border-radius:50%;background:#5CE8A0;flex:none}
.chip span{color:var(--text-3);font-family:-apple-system,system-ui,sans-serif}

footer{display:flex;justify-content:space-between;align-items:center;gap:16px;
  max-width:820px;width:100%;margin:0 auto;padding:18px 32px 22px;color:var(--text-3);font-size:12px}
footer b{color:var(--text-2);font-weight:500;font-variant-numeric:tabular-nums}
footer a{color:var(--text-3);text-decoration:none}
footer a:hover{color:var(--text)}
footer nav{display:flex;gap:16px}
</style>
</head>
<body>
<main>
  <form class="search" id="search" role="search">
    <svg viewBox="0 0 18 18" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="5.6" stroke="currentColor" stroke-width="1.6"/><path d="M12.3 12.3L16 16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <input id="q" autocomplete="off" spellcheck="false" aria-label="Search or enter address">
    <kbd>/</kbd>
  </form>

  <div class="trayhead" id="trayhead" role="tablist"></div>
  <div id="grid" class="grid"></div>
  <form class="addrow" id="addrow">
    <input id="addurl" placeholder="example.com" aria-label="Shortcut address">
    <input id="addtitle" placeholder="Name (optional)" aria-label="Shortcut name" style="flex:.6">
    <button class="btn" type="submit">Add</button>
  </form>

  <section class="servers" id="servers" hidden>
    <h2>Running on this Mac <button id="scope"></button></h2>
    <div class="chips" id="chips"></div>
  </section>
</main>

<footer>
  <div id="shield">&nbsp;</div>
  <nav>
    <a href="/bookmarks.html">Bookmarks</a>
    <a href="/history.html">History</a>
    <a href="/tools.html">Tools</a>
    <a href="/settings.html">Settings</a>
  </nav>
</footer>

<script>
const post = (action, payload) => fetch('/api/command', {
  method:'POST', headers:{'Content-Type':'application/json'},
  body: JSON.stringify({action, payload: payload||{}})
}).catch(()=>{});
const getState = () => fetch('/api/state',{cache:'no-store'}).then(r=>r.json()).catch(()=>null);
const hostOf = u => { try { return new URL(u).host.replace(/^www\./,'') } catch(e) { return u } };
const $ = id => document.getElementById(id);
const store = { get(k){ try { return localStorage.getItem(k) } catch(e){ return null } },
                set(k,v){ try { localStorage.setItem(k,v) } catch(e){} } };

let state = {};
let shownRevision = -1;
let activeTray = store.get('forge.tray');
let editing = false;
let busy = false;        // pointer down, dragging or typing: never rebuild under the user
let pendingRender = false;

/* ---------- search ---------- */
const q = $('q');
$('search').onsubmit = e => {
  e.preventDefault();
  const v = q.value.trim();
  if(!v) return;
  post(e.submitter && e.submitter.dataset.newtab ? 'newTab' : 'navigate', {url:v});
};
q.addEventListener('keydown', e => {
  if(e.key === 'Enter' && e.metaKey){ e.preventDefault(); const v=q.value.trim(); if(v) post('newTab',{url:v}); }
});
document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName) || document.activeElement.isContentEditable;
  if(typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if(e.key === '/'){ e.preventDefault(); q.focus(); return; }
  if(e.key.length === 1){ q.focus(); }
});

/* ---------- open a URL the way the user asked ---------- */
function openURL(url, e){
  if(e && (e.metaKey || e.button === 1)) post('newTab',{url, background: !e.shiftKey});
  else post('navigate',{url});
}

/* ---------- shortcuts ---------- */
const COLORS = ['#5C7CE8','#A4A86A','#E8875C','#5CC8E8','#B49CF0','#5CE8A0','#F07FAE','#E8C65C'];
const hue = s => COLORS[[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7) % COLORS.length];

function icon(site){
  const box = document.createElement('span');
  box.className = 'ic';
  const name = (site.title || hostOf(site.url) || '?').trim();
  const mono = () => {
    const b = document.createElement('b');
    b.textContent = name.charAt(0).toUpperCase();
    box.style.background = hue(hostOf(site.url)) + '33';
    box.appendChild(b);
  };
  let src;
  try { src = new URL('/favicon.ico', site.url).href } catch(e) { mono(); return box }
  const img = new Image();
  img.alt = '';
  img.onerror = () => { img.remove(); mono(); };
  img.onload = () => { if(img.naturalWidth < 8){ img.remove(); mono(); } };
  img.src = src;
  box.appendChild(img);
  return box;
}

function currentTray(){
  const trays = state.trays || [];
  return trays.find(t => t.name === activeTray) || trays[0];
}

function renderTrayHead(){
  const head = $('trayhead');
  head.innerHTML = '';
  const trays = state.trays || [];
  const tray = currentTray();
  trays.forEach(t => {
    const b = document.createElement('button');
    b.className = 'traytab' + (tray && t.name === tray.name ? ' on' : '');
    b.textContent = t.name;
    b.setAttribute('role','tab');
    b.onclick = () => { if(b.isContentEditable) return; activeTray = t.name; store.set('forge.tray', t.name); render(); };
    b.ondblclick = () => editTrayName(b, t.name);
    head.appendChild(b);
  });
  const plus = document.createElement('button');
  plus.className = 'ghost';
  plus.textContent = '+ Group';
  plus.title = 'Add a shortcut group';
  plus.onclick = () => {
    let n = 1, name = 'Group';
    while(trays.some(t => t.name === name)) name = 'Group ' + (++n);
    post('addTray',{name}); activeTray = name; store.set('forge.tray', name);
  };
  head.appendChild(plus);
  const spacer = document.createElement('span'); spacer.className = 'spacer'; head.appendChild(spacer);
  if(editing && tray && trays.length > 1){
    const del = document.createElement('button');
    del.className = 'ghost';
    del.textContent = 'Delete “' + tray.name + '”';
    del.onclick = () => { post('removeTray',{name: tray.name}); activeTray = null; };
    head.appendChild(del);
  }
  const edit = document.createElement('button');
  edit.className = 'ghost' + (editing ? ' on' : '');
  edit.textContent = editing ? 'Done' : 'Edit';
  edit.onclick = () => { editing = !editing; render(); };
  head.appendChild(edit);
}

function editTrayName(el, from){
  busy = true;
  el.contentEditable = 'true';
  el.focus();
  document.getSelection().selectAllChildren(el);
  const finish = save => {
    el.contentEditable = 'false';
    busy = false;
    const to = el.textContent.trim();
    if(save && to && to !== from){ post('renameTray',{from, to}); activeTray = to; store.set('forge.tray', to); }
    else el.textContent = from;
    flush();
  };
  el.onkeydown = e => {
    if(e.key === 'Enter'){ e.preventDefault(); finish(true); }
    if(e.key === 'Escape'){ e.preventDefault(); finish(false); }
  };
  el.onblur = () => finish(true);
}

let dragURL = null;

function renderGrid(){
  const grid = $('grid');
  grid.innerHTML = '';
  grid.parentElement.classList.toggle('editing', editing);
  document.body.classList.toggle('editing', editing);
  const tray = currentTray();
  if(!tray){ grid.innerHTML = '<div class="empty">No shortcuts yet.</div>'; return; }

  tray.sites.forEach((site, index) => {
    const tile = document.createElement('a');
    tile.className = 'tile';
    tile.href = site.url;
    tile.title = site.url;
    tile.draggable = editing;
    tile.appendChild(icon(site));
    const lab = document.createElement('span');
    lab.className = 'lab';
    lab.textContent = site.title || hostOf(site.url);
    tile.appendChild(lab);

    const x = document.createElement('button');
    x.className = 'x';
    x.textContent = '×';
    x.title = 'Remove';
    x.onclick = e => {
      e.preventDefault(); e.stopPropagation();
      tray.sites.splice(index, 1);              // optimistic: no flash of the old tile
      renderGrid();
      post('removeShortcut',{url: site.url, tray: tray.name});
    };
    tile.appendChild(x);

    tile.addEventListener('click', e => {
      e.preventDefault();
      if(editing){ renameSite(lab, tray, site); return; }
      openURL(site.url, e);
    });
    tile.addEventListener('auxclick', e => { if(e.button === 1){ e.preventDefault(); openURL(site.url, e); } });

    tile.addEventListener('dragstart', e => {
      dragURL = site.url; busy = true; tile.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/uri-list', site.url);
    });
    tile.addEventListener('dragend', () => { dragURL = null; busy = false; tile.classList.remove('dragging'); flush(); });
    tile.addEventListener('dragover', e => { if(dragURL && dragURL !== site.url){ e.preventDefault(); tile.classList.add('drop'); } });
    tile.addEventListener('dragleave', () => tile.classList.remove('drop'));
    tile.addEventListener('drop', e => {
      e.preventDefault(); tile.classList.remove('drop');
      if(!dragURL) return;
      const from = tray.sites.findIndex(s => s.url === dragURL);
      if(from < 0) return;
      const [moved] = tray.sites.splice(from, 1);
      tray.sites.splice(index, 0, moved);
      post('moveShortcut',{url: moved.url, tray: tray.name, index});
      dragURL = null; busy = false;
      renderGrid();
    });
    grid.appendChild(tile);
  });

  const add = document.createElement('button');
  add.className = 'tile add';
  add.innerHTML = '<span class="ic"><svg viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span><span class="lab">Add</span>';
  add.onclick = () => {
    const row = $('addrow');
    row.classList.toggle('on');
    if(row.classList.contains('on')) $('addurl').focus();
  };
  grid.appendChild(add);
}

function renameSite(lab, tray, site){
  if(lab.isContentEditable) return;
  busy = true;
  lab.contentEditable = 'true';
  lab.focus();
  document.getSelection().selectAllChildren(lab);
  const finish = save => {
    lab.contentEditable = 'false';
    busy = false;
    const title = lab.textContent.trim();
    if(save && title && title !== site.title){ site.title = title; post('renameShortcut',{url: site.url, tray: tray.name, title}); }
    else lab.textContent = site.title || hostOf(site.url);
    flush();
  };
  lab.onkeydown = e => {
    if(e.key === 'Enter'){ e.preventDefault(); finish(true); }
    if(e.key === 'Escape'){ e.preventDefault(); finish(false); }
  };
  lab.onblur = () => finish(true);
}

$('addrow').onsubmit = e => {
  e.preventDefault();
  const raw = $('addurl').value.trim();
  if(!raw) return;
  const url = /^[a-z]+:\/\//i.test(raw) ? raw : 'https://' + raw;
  const title = $('addtitle').value.trim() || hostOf(url);
  const tray = currentTray();
  if(tray){ tray.sites.push({title, url}); renderGrid(); }
  post('addShortcut',{url, title, tray: tray ? tray.name : undefined});
  $('addurl').value = ''; $('addtitle').value = '';
  $('addrow').classList.remove('on');
};
['addurl','addtitle'].forEach(id => {
  $(id).addEventListener('focus', () => { busy = true; });
  $(id).addEventListener('blur', () => { busy = false; flush(); });
  $(id).addEventListener('keydown', e => { if(e.key === 'Escape') $('addrow').classList.remove('on'); });
});

/* ---------- dev servers ---------- */
function renderServers(){
  const list = state.devServers || [];
  const all = state.devServersShowAll === true;
  $('servers').hidden = list.length === 0 && !all;
  $('scope').textContent = all ? 'Show dev servers only' : 'Show all ports';
  $('scope').onclick = () => post('setDevServerScope',{all: !all});
  const chips = $('chips');
  chips.innerHTML = '';
  list.slice(0, all ? 24 : 8).forEach(s => {
    const a = document.createElement('a');
    a.className = 'chip';
    a.href = s.url;
    a.innerHTML = '<i></i>';
    a.append(':' + s.port);
    if(s.process){ const sp = document.createElement('span'); sp.textContent = s.process; a.appendChild(sp); }
    a.onclick = e => { e.preventDefault(); openURL(s.url, e); };
    chips.appendChild(a);
  });
}

/* ---------- counters: painted in place, never trigger a rebuild ---------- */
function fmtBytes(n){
  if(!n) return '0 B';
  const u=['B','KB','MB','GB','TB']; let i=0,v=n;
  while(v>=1024&&i<u.length-1){v/=1024;i++}
  return v.toFixed(v<10&&i>0?1:0)+' '+u[i];
}
function fmtDuration(s){
  if(!s || s < 60) return Math.round(s||0) + ' s';
  if(s < 3600) return Math.round(s/60) + ' min';
  return (s/3600).toFixed(1) + ' h';
}
function paintCounters(){
  const st = state.stats || {};
  const n = st.lifetimeBlocked || 0;
  const html = n
    ? '<b>' + n.toLocaleString() + '</b> trackers and ads blocked · <b>' + fmtBytes(st.lifetimeBytesSaved) +
      '</b> not downloaded · about <b>' + fmtDuration(st.estimatedSecondsSaved) + '</b> saved'
    : 'Shields are on. Blocked trackers will be counted here.';
  const el = $('shield');
  if(el.innerHTML !== html) el.innerHTML = html;
}

function render(){
  if(busy){ pendingRender = true; return; }
  pendingRender = false;
  const engine = (state.searchEngines||[]).find(e => e.id === state.currentSearchEngine);
  q.placeholder = 'Search with ' + (engine ? engine.name : 'the web') + ' or enter address';
  renderTrayHead();
  renderGrid();
  renderServers();
}
function flush(){ if(pendingRender) render(); }

document.addEventListener('pointerdown', () => { if(!busy){ busy = 'pointer'; } }, true);
document.addEventListener('pointerup', () => { if(busy === 'pointer'){ busy = false; setTimeout(flush, 0); } }, true);

async function poll(){
  const next = await getState();
  if(next){
    const layoutChanged = next.revision !== shownRevision;
    state = next;
    if(layoutChanged){ shownRevision = next.revision; render(); }
    paintCounters();
  }
  setTimeout(poll, document.hidden ? 5000 : 1500);
}
poll();
</script>
</body>
</html>
