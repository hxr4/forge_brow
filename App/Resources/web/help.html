<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Help</title>
<link rel="stylesheet" href="/forge.css"><script src="/_shell.js" defer></script></head><body>
<script defer>
window.addEventListener('DOMContentLoaded', () => {
  const root = shell('Keyboard &amp; Help');
  const groups = [
    ['Navigation', [['&#8984;L','Focus address bar'],['&#8984;R','Reload'],['&#8984;&#8679;R','Force reload'],
      ['&#8984;[','Back'],['&#8984;]','Forward'],['&#8984;&#8679;H','Home'],['&#8984;.','Stop']]],
    ['Tabs & windows', [['&#8984;T','New tab'],['&#8984;W','Close tab'],['&#8984;&#8679;T','Reopen closed tab'],
      ['&#8984;N','New window'],['&#8963;&#8677;','Next tab'],['&#8963;&#8679;&#8677;','Previous tab'],
      ['&#8984;&#8679;E','Toggle vertical tabs']]],
    ['Page', [['&#8984;F','Find in page'],['&#8984;G','Find next'],['&#8984;0','Actual size'],
      ['&#8984;+','Zoom in'],['&#8984;-','Zoom out'],['&#8984;P','Print'],['&#8984;D','Bookmark tab']]],
    ['Developer', [['&#8984;K','Command palette'],['&#8997;&#8984;I','DevTools'],['&#8997;&#8984;U','View source'],
      ['&#8984;Y','History'],['&#8997;&#8984;B','Bookmarks'],['&#8984;&#8679;J','Downloads'],['&#8984;,','Settings']]]
  ];
  root.innerHTML = groups.map(g =>
    '<div class="sect"><h2>'+g[0]+'</h2><div class="card">' + g[1].map(k =>
      '<div class="row"><div class="lab">'+k[1]+'</div><span class="kbd">'+k[0]+'</span></div>').join('')
    + '</div></div>').join('')
    + '<div class="sect"><h2>Why this browser</h2><div class="card"><div class="row"><div>'
    + '<div class="sub" style="line-height:1.7">Forge is a personal development browser. The things it does that '
    + 'Chrome and Brave do not: every tool reachable from one command palette, live localhost service detection on the '
    + 'new tab page, per-tab security bypasses that cannot be left on silently, and a utility belt that works offline '
    + 'with no extension permissions.</div></div></div></div></div>';
});
</script></body></html>
